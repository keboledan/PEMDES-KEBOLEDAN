function loadDBLocal() {
    const def = { penduduk: [], pbb: [], dtks: [], admin_pertanahan: [], arsip_tanah: [], arsip_surat: [], log: [], docs_pembangunan: [], docs_pemberdayaan: [], docs_pembinaan: [], docs_ruang_kerja: [] };
    return JSON.parse(localStorage.getItem('desa_keboledan_v3_2_db')) || def;
}

function saveDB(targetKey = null) {
    localStorage.setItem('desa_keboledan_v3_2_db', JSON.stringify(APP_STATE.db));
    if (typeof google !== 'undefined' && google.script && google.script.run) {
        const statusEl = document.getElementById('sync-status');
        if (statusEl) statusEl.innerHTML = `<i class="fas fa-spinner fa-spin text-amber-500"></i> Syncing...`;
        
        if (targetKey) {
            google.script.run.withSuccessHandler(() => {
                if (statusEl) statusEl.innerHTML = `<i class="fas fa-cloud-check text-emerald-600"></i> Spreadsheet Active`;
            }).saveSheetData(targetKey, APP_STATE.db[targetKey]);
        } else {
            Object.keys(APP_STATE.db).forEach(key => {
                google.script.run.saveSheetData(key, APP_STATE.db[key]);
            });
            if (statusEl) statusEl.innerHTML = `<i class="fas fa-cloud-check text-emerald-600"></i> Spreadsheet Active`;
        }
    }
}

function fetchSpreadsheetData() {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run.withSuccessHandler((sheetDB) => {
            if (sheetDB && Object.keys(sheetDB).length > 0) {
                APP_STATE.db = { ...APP_STATE.db, ...sheetDB };
                localStorage.setItem('desa_keboledan_v3_2_db', JSON.stringify(APP_STATE.db));
                if (APP_STATE.currentUser) navigate(APP_STATE.currentPage);
            }
        }).getInitialData();
    }
}

function addLog(action) {
    if (!APP_STATE.db.log) APP_STATE.db.log = [];
    APP_STATE.db.log.push({ user: APP_STATE.currentUser ? APP_STATE.currentUser.role : 'System', action, time: Date.now() });
    saveDB('log');
}

function generateAutoNomorSurat(kodeKlasifikasi = '470') {
    const totalSurat = (APP_STATE.db.arsip_surat || []).length + 1;
    const noUrut = String(totalSurat).padStart(3, '0');
    const bulanRomawi = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"][new Date().getMonth()];
    const tahun = new Date().getFullYear();
    return `${kodeKlasifikasi}/${noUrut}/${bulanRomawi}/${tahun}`;
}

function getAutoTanggalSistem() {
    return new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
}

function getAutoMasaBerlakuDefault() {
    const d = new Date();
    d.setDate(d.getDate() + 30);
    return `(s/d ${d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })})`;
}

// Helper Generator Barcode DataURL
function generateBarcodeDataURL(codeText) {
    const cleanText = (codeText || 'KEBOLEDAN-2026').replace(/[^a-zA-Z0-9\-\/\.]/g, '');
    try {
        const canvas = document.createElement('canvas');
        if (typeof JsBarcode !== 'undefined') {
            JsBarcode(canvas, cleanText || 'KEBOLEDAN', {
                format: "CODE128",
                width: 1.4,
                height: 36,
                displayValue: true,
                fontSize: 10,
                margin: 2
            });
            return canvas.toDataURL("image/png");
        }
    } catch (e) {
        console.warn('Barcode fallback', e);
    }
    return '';
}

function buildBarcodeFooterBlock(nomorSurat, noKk, tglSurat) {
    const barcodeVal = `${nomorSurat || '470/001'}${noKk ? '-' + noKk : ''}`;
    const imgData = generateBarcodeDataURL(barcodeVal);
    if (!imgData) {
        return `<div class="mt-4 pt-2 border-t border-dashed border-gray-300 text-[10px] text-gray-600">
            <div>No. KK: <b>${noKk || '-'}</b> | Reg: <b>${barcodeVal}</b></div>
        </div>`;
    }
    return `<div class="mt-3 flex flex-col items-start">
        <div class="text-[11px] font-semibold text-black mb-0.5">No. KK : <span class="font-bold tracking-wide">${noKk || '-'}</span></div>
        <img src="${imgData}" alt="Barcode ${barcodeVal}" style="height: 46px; width: auto; max-width: 220px;" />
    </div>`;
}

function changePaperSize(sizeClass) {
    const el = document.getElementById('print-area');
    if (el) {
        el.className = `${sizeClass} bg-white relative text-black shadow-2xl rounded-b-xl border-x border-b border-slate-300 overflow-x-auto`;
    }
    let pageStyle = document.getElementById('dynamic-page-size-style');
    if (!pageStyle) {
        pageStyle = document.createElement('style');
        pageStyle.id = 'dynamic-page-size-style';
        document.head.appendChild(pageStyle);
    }
    if (sizeClass === 'f4-paper') {
        pageStyle.innerHTML = `@media print { @page { size: 215mm 330mm; margin: 12mm 15mm; } }`;
    } else {
        pageStyle.innerHTML = `@media print { @page { size: A4 portrait; margin: 12mm 15mm; } }`;
    }
}

function triggerDirectPrint() {
    const sizeSelect = document.getElementById('paper-size-select')?.value || 'a4-paper';
    changePaperSize(sizeSelect);
    setTimeout(() => {
        window.print();
    }, 150);
}

function handleLogin(e) {
    e.preventDefault();
    const u = document.getElementById('username').value, p = document.getElementById('password').value;
    if (USERS[u] && USERS[u].pass === p) {
        APP_STATE.currentUser = { id: u, ...USERS[u] };
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('app-screen').classList.remove('hidden');
        document.getElementById('user-role-display').innerText = APP_STATE.currentUser.role;
        fetchSpreadsheetData();
        addLog('Login ke Sistem');
        renderSidebar();
        navigate('beranda');
        Swal.fire({ icon: 'success', title: 'Login Berhasil', text: `Selamat datang, ${APP_STATE.currentUser.name}`, showConfirmButton: false, timer: 1500 });
    } else {
        Swal.fire({ icon: 'error', title: 'Akses Ditolak', text: 'Username atau Password salah!' });
    }
}

function handleLogout() {
    Swal.fire({ title: 'Keluar Sistem?', icon: 'question', showCancelButton: true, confirmButtonColor: '#d33', confirmButtonText: 'Ya, Keluar' }).then((result) => {
        if (result.isConfirmed) {
            addLog('Logout dari Sistem');
            APP_STATE.currentUser = null;
            EDIT_ARCHIVE_CONTEXT = null;
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('login-form').reset();
        }
    });
}

function canAccessMenu(item) {
    if (!item.allowedUsers) return true;
    const currentUserId = APP_STATE.currentUser ? APP_STATE.currentUser.id : '';
    return item.allowedUsers.includes(currentUserId);
}

function renderSidebar() {
    const nav = document.getElementById('sidebar-menu');
    nav.innerHTML = '';
    MENU_ITEMS.filter(canAccessMenu).forEach(item => {
        const a = document.createElement('a');
        a.href = '#';
        a.className = `flex items-center gap-3 px-6 py-3.5 text-sm font-medium transition-all duration-200 group ${APP_STATE.currentPage === item.id ? 'bg-gradient-to-r from-green-600/90 to-green-800 text-white border-l-4 border-green-400 shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white border-l-4 border-transparent'}`;
        a.onclick = (e) => { 
            e.preventDefault(); 
            EDIT_ARCHIVE_CONTEXT = null;
            navigate(item.id); 
        };
        a.innerHTML = `<i class="fas ${item.icon} w-6 text-center text-lg group-hover:scale-110 transition-transform ${APP_STATE.currentPage === item.id ? 'text-green-300' : ''}"></i> <span class="tracking-wide">${item.title}</span>`;
        nav.appendChild(a);
    });
}

function navigate(pageId, callbackAfterRender = null) {
    const menuItem = MENU_ITEMS.find(m => m.id === pageId);
    if (menuItem && !canAccessMenu(menuItem)) {
        Swal.fire({
            icon: 'warning',
            title: 'Akses Terbatas',
            text: `Menu ${menuItem.title} hanya dapat diakses oleh Sekretaris Desa (Sekdes) dan Kasi Kesejahteraan (Kasi Kesra).`
        });
        if (APP_STATE.currentPage === pageId) {
            pageId = 'beranda';
        } else {
            return;
        }
    }

    APP_STATE.currentPage = pageId;
    renderSidebar();
    const mTitle = MENU_ITEMS.find(m => m.id === pageId)?.title || 'Dashboard';
    document.getElementById('page-title').innerHTML = `<i class="fas ${MENU_ITEMS.find(m => m.id === pageId)?.icon} text-green-600 mr-2"></i> ${mTitle}`;
    
    const container = document.getElementById('main-content');
    container.innerHTML = '<div class="flex justify-center h-full items-center"><i class="fas fa-circle-notch fa-spin text-5xl text-green-500"></i></div>';
    
    setTimeout(() => { 
        renderPageContent(pageId, container); 
        if (typeof callbackAfterRender === 'function') {
            callbackAfterRender();
        }
    }, 150);
}

                {key:'nop', label:'NOP'}, {key:'nama_wp', label:'Nama Wajib Pajak'}, {key:'pbb_terhutang', label:'PBB (Rp)'}, {key:'status_pembayaran', label:'Status'}, {key:'scan_sppt', label:'File SPPT'}
            ], ['nop', 'nama_wp', 'alamat_wp', 'letak_objek_pajak', 'luas_bumi', 'luas_bangunan', 'pbb_terhutang', 'status_pembayaran', 'scan_sppt']);
            break;
        case 'dtks':
            renderDataMaster(container, 'dtks', [
                {key:'id_dtks', label:'ID DTKS'}, {key:'nama_pengurus', label:'Nama Pengurus KK'}, {key:'alamat', label:'Alamat'}, {key:'status_bantuan', label:'Status Bantuan'}
            ], ['id_dtks','nama_pengurus','nik','no_kk','alamat','rt','rw','status_bantuan','keterangan']);
            break;
        case 'admin_pertanahan':
            renderPelayananPertanahan(container);
            break;
        case 'arsip_tanah':
            if(!APP_STATE.db[pageId]) APP_STATE.db[pageId] = [];
            renderDataMaster(container, pageId, [
                {key:'nomor_persil', label:'No. Persil/Kohir'}, {key:'nama_pemilik', label:'Nama Pemilik'}, {key:'luas_m2', label:'Luas (m²)'}, {key:'jenis_dokumen', label:'Jenis Dok'}, {key:'tanggal_perubahan', label:'Tgl Perubahan'}
            ], ['nomor_persil','kelas_desa','luas_m2','nama_pemilik','alamat_pemilik','sebab_perubahan','tanggal_perubahan','jenis_dokumen','keterangan', 'scan_ajb', 'scan_akte_hibah', 'scan_akte_waris', 'scan_sertifikat']);
            break;
        case 'arsip_surat':
            if(!APP_STATE.db[pageId]) APP_STATE.db[pageId] = [];
            renderDataMaster(container, pageId, [
                {key:'tanggal', label:'Tanggal Cetak'}, {key:'jenis', label:'Jenis Surat / Dokumen'}, {key:'pemohon', label:'Pemohon / Pihak'}, {key:'keterangan', label:'Keterangan'}
            ], ['tanggal','jenis','pemohon','keterangan']);
            break;
        case 'pelayanan_surat':
            renderPelayananSurat(container);
            break;
        case 'buat_undangan':
            renderBuatUndangan(container);
            break;
        case 'pembangunan': case 'pemberdayaan': case 'pembinaan': case 'ruang_kerja':
            renderWorkspaceArea(container, pageId);
            break;
    }
}

function editArsipItem(dbKey, index, fieldsStr) {
    const row = APP_STATE.db[dbKey][index];
    if (!row) return;

    if (row.payload && row.source_module) {
        EDIT_ARCHIVE_CONTEXT = { dbKey, index };
        const mod = row.source_module;

        if (mod === 'pelayanan_surat') {
            navigate('pelayanan_surat', () => {
                const sel = document.getElementById('jenis_surat');
                if (sel && row.sub_type) {
                    sel.value = row.sub_type;
                    buildSuratForm();
                    setTimeout(() => {
                        for (let k in row.payload) {
                            const el = document.getElementById(k);
                            if (el) el.value = row.payload[k];
                        }
                        if (row.payload.s_ttd_jabatan && row.payload.s_ttd_jabatan.includes('SEKRETARIS')) {
                            const pSel = document.getElementById('pilihan_pejabat_ttd');
                            if (pSel) pSel.value = 'sekdes';
                        }
                    }, 50);
                }
            });
            return;
        }
        else if (mod === 'buat_undangan') {
            navigate('buat_undangan', () => {
                setTimeout(() => {
                    for (let k in row.payload) {
                        const el = document.getElementById(k);
                        if (el) el.value = row.payload[k];
                    }
                }, 50);
            });
            return;
        }
        else if (mod === 'admin_pernikahan') {
            navigate('admin_pernikahan', () => {
                const sel = document.getElementById('pilih_modul_nikah');
                if (sel && row.sub_type) sel.value = row.sub_type;
                switchModulNikah();
                setTimeout(() => {
                    for (let k in row.payload) {
                        const el = document.getElementById(k);
                        if (el) el.value = row.payload[k];
                    }
                }, 50);
            });
            return;
        }
        else if (mod === 'admin_pertanahan') {
            navigate('admin_pertanahan', () => {
                const sel = document.getElementById('pilih_modul_pertanahan');
                if (sel && row.sub_type) {
                    sel.value = row.sub_type;
                }
                if (row.extra_state) {
                    if (row.sub_type === 'kutipan_c') BUKU_C_STATE = JSON.parse(JSON.stringify(row.extra_state));
                    else if (row.sub_type === 'kutipan_c_v2') BUKU_C_V2_STATE = JSON.parse(JSON.stringify(row.extra_state));
                    else if (row.sub_type === 'skw') SKW_STATE = JSON.parse(JSON.stringify(row.extra_state));
                    else if (row.sub_type === 'skw_v2') SKW_V2_STATE = JSON.parse(JSON.stringify(row.extra_state));
                    else if (row.sub_type === 'pengajuan_akta') PENGAJUAN_AKTA_STATE = JSON.parse(JSON.stringify(row.extra_state));
                    else if (row.sub_type === 'sporadik') SPORADIK_STATE = JSON.parse(JSON.stringify(row.extra_state));
                }
                switchModulPertanahan();
                setTimeout(() => {
                    for (let k in row.payload) {
                        const el = document.getElementById(k);
                        if (el) el.value = row.payload[k];
                    }
                }, 50);
            });
            return;
        }
    }

    if (dbKey === 'arsip_surat') {
        EDIT_ARCHIVE_CONTEXT = { dbKey, index };
        const jenisLower = (row.jenis || '').toLowerCase();
        
        if (jenisLower.includes('undangan')) {
            navigate('buat_undangan', () => {
                setTimeout(() => {
                    if (document.getElementById('u_tgl_surat')) document.getElementById('u_tgl_surat').value = row.tanggal || getAutoTanggalSistem();
                    if (document.getElementById('u_perihal')) document.getElementById('u_perihal').value = row.jenis.replace(/Surat Undangan\s*\(?|\)?/gi, '').trim() || row.jenis;
                    if (document.getElementById('u_kepada')) document.getElementById('u_kepada').value = row.pemohon || '';
                    if (document.getElementById('u_acara')) document.getElementById('u_acara').value = row.keterangan || '';
                }, 50);
            });
            return;
        }
        
        if (jenisLower.includes('pernikahan') || jenisLower.includes('nikah')) {
            navigate('admin_pernikahan', () => {
                setTimeout(() => {
                    if (document.getElementById('nk_tgl_surat')) document.getElementById('nk_tgl_surat').value = row.tanggal || getAutoTanggalSistem();
                    const parts = (row.pemohon || '').split('&');
                    if (document.getElementById('nk_suami_nama')) document.getElementById('nk_suami_nama').value = (parts[0] || '').trim();
                    if (document.getElementById('nk_istri_nama')) document.getElementById('nk_istri_nama').value = (parts[1] || '').trim();
                }, 50);
            });
            return;
        }

        const matchedJenis = JENIS_SURAT.find(j => jenisLower.includes(j.name.toLowerCase()));
        navigate('pelayanan_surat', () => {
            const sel = document.getElementById('jenis_surat');
            if (sel) {
                sel.value = matchedJenis ? matchedJenis.id : 'custom_judul';
                buildSuratForm();
                setTimeout(() => {
                    if (document.getElementById('s_nama')) document.getElementById('s_nama').value = row.pemohon || '';
                    if (document.getElementById('s_tgl_surat')) document.getElementById('s_tgl_surat').value = row.tanggal || getAutoTanggalSistem();
                    if (document.getElementById('s_keterangan')) document.getElementById('s_keterangan').value = row.keterangan || '';
                    if (document.getElementById('s_judul_custom')) document.getElementById('s_judul_custom').value = row.jenis || 'SURAT KETERANGAN';
                    if (document.getElementById('s_isi_custom')) document.getElementById('s_isi_custom').value = row.keterangan || '';
                }, 50);
            }
        });
    } else if (dbKey === 'arsip_tanah') {
        Swal.fire({
            title: '<div class="text-left font-bold text-lg border-b pb-2"><i class="fas fa-edit text-amber-600 mr-2"></i> Pilih Mode Edit Arsip Tanah</div>',
            html: `<div class="text-left text-sm text-slate-600 my-2">
                <p class="mb-3">Pilih cara mengedit data tanah <b>Persil ${row.nomor_persil || '-'} (${row.nama_pemilik || '-'})</b>:</p>
            </div>`,
            showDenyButton: true,
            showCancelButton: true,
            confirmButtonText: '<i class="fas fa-map-marked-alt mr-1"></i> Edit di Form Admin Pertanahan',
            denyButtonText: '<i class="fas fa-table mr-1"></i> Edit Data Tabel & Scan File',
            cancelButtonText: 'Batal',
            confirmButtonColor: '#d97706',
            denyButtonColor: '#2563eb'
        }).then(res => {
            if (res.isConfirmed) {
                EDIT_ARCHIVE_CONTEXT = { dbKey, index };
                navigate('admin_pertanahan', () => {
                    const sel = document.getElementById('pilih_modul_pertanahan');
                    if (sel) {
                        sel.value = (row.jenis_dokumen || '').toLowerCase().includes('sporadik') ? 'sporadik' : 'pengajuan_akta';
                        switchModulPertanahan();
                        setTimeout(() => {
                            if (document.getElementById('pa_jenis_akta')) document.getElementById('pa_jenis_akta').value = row.jenis_dokumen || 'AKTA APBH';
                            if (document.getElementById('pa_p1_nama')) document.getElementById('pa_p1_nama').value = row.nama_pemilik || '';
                            if (document.getElementById('pa_p1_alamat')) document.getElementById('pa_p1_alamat').value = row.alamat_pemilik || '';
                            if (document.getElementById('pa_persil')) document.getElementById('pa_persil').value = row.nomor_persil || '';
                            if (document.getElementById('pa_kelas')) document.getElementById('pa_kelas').value = row.kelas_desa || '';
                            if (document.getElementById('pa_luas')) document.getElementById('pa_luas').value = row.luas_m2 || '';
                        }, 50);
                    }
                });
            } else if (res.isDenied) {
                showFormEdit(dbKey, index, fieldsStr);
            }
        });
    } else {
        showFormEdit(dbKey, index, fieldsStr);
    }
}

        addLog(`Update Arsip Pernikahan (${modul.toUpperCase()})`);
        EDIT_ARCHIVE_CONTEXT = null;
    } else {
        APP_STATE.db.arsip_surat.push(arsipEntry);
        addLog(`Cetak Administrasi Pernikahan (${modul.toUpperCase()})`);
    }
    saveDB('arsip_surat');
}

function populateTable(dbKey, cols, fieldsStr) {
    const tbody = document.querySelector(`#table-${dbKey} tbody`);
    tbody.innerHTML = '';
    const data = APP_STATE.db[dbKey] || [];
    const isArsipDoc = (dbKey === 'arsip_surat' || dbKey === 'arsip_tanah');

    if(data.length===0){
        tbody.innerHTML=`<tr><td colspan="${cols.length+2}" class="text-center p-16 text-slate-400"><i class="fas fa-folder-open text-6xl mb-4 block text-slate-200"></i><p class="text-lg font-semibold text-slate-500">Database Kosong</p><p class="text-sm mt-1">Silakan buat surat baru, tambah data manual, atau Upload file CSV.</p></td></tr>`;
        return;
    }
    
    data.forEach((row, i) => {
        let html = `<td class="py-3 px-5 text-center text-slate-500 bg-slate-50/50">${i+1}</td>`;
        
        cols.forEach(c => {
            let val = row[c.key] || '-';
            if(val.length > 100 && val.startsWith('data:image')) val = `<span class="bg-blue-100 text-blue-700 px-3 py-1.5 rounded-lg text-xs font-bold border border-blue-200"><i class="fas fa-image mr-1"></i> Scan Tersedia</span>`;
            else if (val.startsWith('http')) val = `<a href="${val}" target="_blank" class="bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded-lg text-xs font-bold border border-indigo-200 hover:bg-indigo-200 transition"><i class="fas fa-link mr-1"></i> Buka Link</a>`;
            html += `<td class="py-3 px-5 truncate max-w-xs" title="${val}">${val}</td>`;
        });
        
        if (isArsipDoc) {
            html += `<td class="py-3 px-5 text-center space-x-1.5 sticky right-0 bg-white border-l border-slate-100 shadow-[-5px_0_10px_rgba(0,0,0,0.02)]">
                <button onclick="reviewArsipDokumen('${dbKey}', ${i})" class="text-emerald-700 hover:text-white hover:bg-emerald-600 bg-emerald-50 px-2.5 py-1.5 rounded-lg transition border border-emerald-200 shadow-sm text-xs font-bold" title="Preview Tampilan Asli & Cetak (A4/F4)"><i class="fas fa-eye mr-1"></i> Preview</button>
                <button onclick="editArsipItem('${dbKey}', ${i}, '${fieldsStr}')" class="text-blue-700 hover:text-white hover:bg-blue-600 bg-blue-50 px-2.5 py-1.5 rounded-lg transition border border-blue-200 shadow-sm text-xs font-bold" title="Update / Edit di Form Pembuatan Awal"><i class="fas fa-edit mr-1"></i> Edit Surat</button>
                <button onclick="showDataDetail('${dbKey}', ${i})" class="text-teal-600 hover:text-white hover:bg-teal-600 bg-teal-50 p-1.5 rounded-lg transition border border-teal-100 shadow-sm" title="Detail Ringkasan"><i class="fas fa-info-circle w-4"></i></button>
                <button onclick="hapusData('${dbKey}', ${i})" class="text-red-600 hover:text-white hover:bg-red-600 bg-red-50 p-1.5 rounded-lg transition border border-red-100 shadow-sm" title="Hapus Data"><i class="fas fa-trash w-4"></i></button>
            </td>`;
        } else {
            html += `<td class="py-3 px-5 text-center space-x-1 sticky right-0 bg-white border-l border-slate-100 shadow-[-5px_0_10px_rgba(0,0,0,0.02)]">
                <button onclick="showDataDetail('${dbKey}', ${i})" class="text-teal-600 hover:text-white hover:bg-teal-600 bg-teal-50 p-2 rounded-lg transition border border-teal-100 shadow-sm" title="Preview / Detail Dokumen"><i class="fas fa-eye w-4"></i></button>
                <button onclick="showFormEdit('${dbKey}', ${i}, '${fieldsStr}')" class="text-blue-600 hover:text-white hover:bg-blue-600 bg-blue-50 p-2 rounded-lg transition border border-blue-100 shadow-sm" title="Edit Data"><i class="fas fa-edit w-4"></i></button>

        }

        let tr = document.createElement('tr');
        tr.className="hover:bg-slate-50 transition";
        tr.innerHTML = html;
        tbody.appendChild(tr);
    });
}

function filterTable(dbKey) {
    const term = document.getElementById(`search-${dbKey}`).value.toLowerCase();
    const rows = document.querySelectorAll(`#table-${dbKey} tbody tr`);
    rows.forEach(row => {
        row.style.display = row.innerText.toLowerCase().includes(term) ? '' : 'none';
    });
}

    const kkMap = {};
    pendudukList.forEach(p => {

function handleFileToInput(fileInput, targetInputId) {
    const file = fileInput.files[0];
    if(!file) return;
    if(file.size > 2 * 1024 * 1024) return Swal.fire('Error', 'Ukuran file gambar maksimal 2MB untuk penyimpanan.', 'error');
    
    const reader = new FileReader();
    reader.onload = (e) => {
        document.getElementById(targetInputId).value = e.target.result;
        const previewImg = document.getElementById(`preview-img-${targetInputId}`);
        if(previewImg) {
            previewImg.src = e.target.result;
            previewImg.classList.remove('hidden');
        }
    };
    reader.readAsDataURL(file);
}

function buildFormHtml(fields, data = {}) {
    let html = '<div class="grid grid-cols-1 md:grid-cols-2 gap-4">';
    fields.forEach(f => {
        const label = f.replace(/_/g, ' ').toUpperCase();
        let val = data[f] || '';
        const isScan = f.startsWith('scan');
        
        if (isScan) {
            html += `<div class="col-span-1 md:col-span-2 p-3 bg-blue-50 rounded-xl border border-blue-200">
                <label class="block text-xs font-extrabold text-blue-800 mb-2"><i class="fas fa-file-upload mr-1"></i> UNGGAH DOKUMEN: ${label}</label>
                <div class="flex gap-2 items-center">
                    <input type="text" id="inp-${f}" value="${val}" class="flex-1 p-2.5 bg-white border border-blue-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="Paste Link URL atau Browse Gambar">
                    <input type="file" id="file-${f}" accept="image/*" class="hidden" onchange="handleFileToInput(this, 'inp-${f}')">
                    <label for="file-${f}" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-lg cursor-pointer text-sm font-bold whitespace-nowrap shadow-md transition"><i class="fas fa-camera mr-1"></i> Browse Scan</label>
                </div>
                <img id="preview-img-inp-${f}" src="${val.startsWith('data:image')?val:''}" class="mt-3 max-h-32 rounded-lg border border-blue-300 shadow-sm object-cover ${val.startsWith('data:image')?'':'hidden'}">
            </div>`;
        } else if (f === 'alamat' || f === 'keterangan') {
            html += `<div class="col-span-1 md:col-span-2 text-left"><label class="block text-xs font-bold text-slate-700 mb-1">${label}</label><textarea id="inp-${f}" rows="2" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-green-500 outline-none">${val}</textarea></div>`;
        } else {
            html += `<div class="text-left"><label class="block text-xs font-bold text-slate-700 mb-1">${label}</label><input id="inp-${f}" value="${val}" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-green-500 outline-none font-medium"></div>`;
        }
    });
    html += '</div>';
    return html;
}

function showFormTambah(dbKey, fieldsStr) {
    const fields = fieldsStr.split(',');
    Swal.fire({
        title: `<div class="text-left font-bold text-xl mb-4 border-b pb-2"><i class="fas fa-plus-circle text-green-500 mr-2"></i>Tambah Data Baru</div>`,
        html: buildFormHtml(fields),
        customClass: { popup: 'swal-wide rounded-2xl' },
        showCancelButton: true,
        confirmButtonText: '<i class="fas fa-save mr-1"></i> Simpan Data',
        confirmButtonColor: '#16a34a',
        cancelButtonText: 'Batal',
        preConfirm: () => {
            let obj = {};
            fields.forEach(f => obj[f] = document.getElementById(`inp-${f}`).value);
            return obj;
        }
    }).then(r => {
        if(r.isConfirmed) {
            APP_STATE.db[dbKey].push(r.value);
            saveDB(dbKey);
            navigate(dbKey);
            Swal.fire('Berhasil','Data tersimpan ke Spreadsheet','success');
        }
    });
}

function showFormEdit(dbKey, index, fieldsStr) {
    const fields = fieldsStr.split(',');
    const rowData = APP_STATE.db[dbKey][index];
    Swal.fire({
        title: `<div class="text-left font-bold text-xl mb-4 border-b pb-2"><i class="fas fa-edit text-blue-500 mr-2"></i>Update Data</div>`,
        html: buildFormHtml(fields, rowData),
        customClass: { popup: 'swal-wide rounded-2xl' },
        showCancelButton: true,
        confirmButtonText: '<i class="fas fa-check mr-1"></i> Update Data',
        confirmButtonColor: '#2563eb',
        cancelButtonText: 'Batal',
        preConfirm: () => {
            let obj = { ...rowData };
            fields.forEach(f => obj[f] = document.getElementById(`inp-${f}`).value);
            return obj;
        }
    }).then(r => {
        if(r.isConfirmed) {
            APP_STATE.db[dbKey][index] = r.value;
            saveDB(dbKey);
            navigate(dbKey);
            Swal.fire('Terupdate','Data berhasil diubah','success');
        }
    });
}

function showDataDetail(dbKey, index) {
    const row = APP_STATE.db[dbKey][index];
    const hiddenKeys = ['payload', 'html_snapshot', 'source_module', 'sub_type', 'extra_state'];
    let html = `<div class="text-left"><table class="w-full text-sm border-collapse rounded-xl overflow-hidden shadow-sm border border-slate-200">`;
    for(let key in row) {
        if (hiddenKeys.includes(key)) continue;
        let val = row[key] || '-';
        if(typeof val === 'string' && val.startsWith('data:image')) val = `<img src="${val}" class="max-h-48 rounded-lg border border-slate-300 shadow-sm mt-1 mb-1 object-contain">`;
        else if(typeof val === 'string' && val.startsWith('http')) val = `<a href="${val}" target="_blank" class="text-blue-600 font-bold hover:underline bg-blue-50 px-3 py-1 rounded-md inline-block mt-1"><i class="fas fa-external-link-alt mr-1"></i> Buka Tautan Scan</a>`;
        
        html += `<tr class="border-b border-slate-200 last:border-0 hover:bg-slate-50 transition">
            <td class="p-3 font-bold w-1/3 align-top bg-slate-100/50 text-slate-700 capitalize border-r border-slate-200">${key.replace(/_/g, ' ')}</td>
            <td class="p-3 font-medium text-slate-800 break-words align-middle">${val}</td>
        </tr>`;
    }
    html += `</table></div>`;
    Swal.fire({
        title: `<div class="text-left font-extrabold text-xl mb-2 flex items-center border-b pb-3"><i class="fas fa-file-alt text-teal-600 mr-3"></i> Detail / Preview Dokumen Data</div>`,
        html: html,
        width: '750px',
        confirmButtonText: '<i class="fas fa-times mr-1"></i> Tutup Preview',
        confirmButtonColor: '#64748b',
        customClass: { popup: 'rounded-2xl' }
    });
}

function hapusData(dbKey, i) {
    Swal.fire({title: 'Hapus data ini?', text:'Data akan dihapus dari Spreadsheet!', icon: 'warning', showCancelButton:true, confirmButtonColor:'#dc2626', confirmButtonText:'Ya, Hapus!'}).then(r=>{
        if(r.isConfirmed){
            APP_STATE.db[dbKey].splice(i,1);
            saveDB(dbKey);
            navigate(dbKey);
        }
    });
}

function handleCSVUpload(e, dbKey) {
    const file = e.target.files[0];
    if(!file) return;
    Papa.parse(file, { header: true, skipEmptyLines: true, complete: function(res) {
        if(res.data.length > 0) {
            if(!APP_STATE.db[dbKey]) APP_STATE.db[dbKey] = [];
            APP_STATE.db[dbKey] = [...APP_STATE.db[dbKey], ...res.data];
            saveDB(dbKey);
            addLog(`Upload CSV ke ${dbKey}`);
            navigate(dbKey);
            Swal.fire('Berhasil', `${res.data.length} baris diimpor & disimpan ke Spreadsheet!`, 'success');
        }
    }});
}

function exportDataExcel(dbKey) {
    const data = APP_STATE.db[dbKey] || [];
    if(!data.length) return Swal.fire('Kosong', 'Tidak ada data untuk diekspor', 'info');
    const hiddenKeys = ['payload', 'html_snapshot', 'source_module', 'sub_type', 'extra_state'];
    const cleanData = data.map(row => {
        let newRow = {};
        for(let k in row) {
            if (hiddenKeys.includes(k)) continue;
            newRow[k] = (row[k] && row[k].toString().startsWith('data:image')) ? 'Terdapat File Scan' : row[k];
        }
        return newRow;
    });
    const ws = XLSX.utils.json_to_sheet(cleanData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Data");
    XLSX.writeFile(wb, `Eksport_${dbKey}_${Date.now()}.xlsx`);
    addLog(`Eksport Excel ${dbKey}`);
}

function downloadAsWord(htmlString, filename) {
    const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' "+
                   "xmlns:w='urn:schemas-microsoft-com:office:word' "+
                   "xmlns='http://www.w3.org/TR/REC-html40'>"+
                   "<head><meta charset='utf-8'><title>Export Word</title></head><body>";
    const footer = "</body></html>";
    const sourceHTML = header + htmlString + footer;
    const source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
    const fileDownload = document.createElement("a");
    document.body.appendChild(fileDownload);
    fileDownload.href = source;
    fileDownload.download = `${filename}.doc`;
    fileDownload.click();
    document.body.removeChild(fileDownload);
}

function exportDataWord(dbKey, title) {
    const data = APP_STATE.db[dbKey] || [];
    if(!data.length) return Swal.fire('Kosong', 'Tidak ada data untuk diekspor', 'info');
    const hiddenKeys = ['payload', 'html_snapshot', 'source_module', 'sub_type', 'extra_state'];
    
    let html = `<h2 style="text-align:center;font-family:sans-serif;margin-bottom:20px;">Laporan Data ${title} - Desa Keboledan</h2>`;
    html += `<table border="1" cellpadding="5" style="border-collapse: collapse; width: 100%; text-align: left; font-family:sans-serif; font-size:12px;"><thead><tr style="background-color:#f0f0f0;">`;
    const keys = Object.keys(data[0]).filter(k => !hiddenKeys.includes(k));
    html += `<th>No</th>`;
    keys.forEach(k => html += `<th>${k.replace(/_/g, ' ').toUpperCase()}</th>`);
    html += `</tr></thead><tbody>`;
    
    data.forEach((row, idx) => {
        html += `<tr><td>${idx+1}</td>`;
        keys.forEach(k => {
            let val = row[k]||'';
            if(typeof val === 'string' && val.startsWith('data:image')) val = 'Ada Lampiran Scan';
            html += `<td>${val}</td>`;
        });
        html += `</tr>`;
    });
    html += `</tbody></table>`;
    downloadAsWord(html, `Laporan_${dbKey}`);
    addLog(`Eksport Word ${dbKey}`);
}

function exportDataPDF(dbKey, title) {

}

function saveWorkspaceDoc(dbKey) {
    const title = document.getElementById('editor-title').value.trim() || 'Dokumen Tanpa Judul';
    const content = quillEditor.root.innerHTML;
    if(!content || content === '<p><br></p>') return Swal.fire('Kosong', 'Isi dokumen tidak boleh kosong', 'warning');
    
    const docObj = {
        tipe: 'Dokumen Teks',
        nama: title,
        tanggal: new Date().toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'}),
        content: content
    };
    
    if(currentWorkspaceEditIndex >= 0) {
        APP_STATE.db[dbKey][currentWorkspaceEditIndex] = docObj;
        addLog(`Update dokumen arsip: ${title}`);
    } else {
        APP_STATE.db[dbKey].push(docObj);
        addLog(`Buat dokumen arsip: ${title}`);
    }
    
    saveDB(dbKey);
    renderWorkspaceFileList(dbKey);
    Swal.fire('Tersimpan', 'Dokumen tersimpan ke Spreadsheet', 'success');
}

function handleWorkspaceUpload(event, dbKey) {
    const files = event.target.files;
    if(!files.length) return;
    
    Array.from(files).forEach(f => {
        const isImg = f.type.startsWith('image/');
        if(isImg && f.size < 2*1024*1024) {
            const reader = new FileReader();
            reader.onload = (e) => {
                APP_STATE.db[dbKey].push({
                    tipe: 'File Gambar', nama: f.name, ukuran: (f.size/1024).toFixed(1)+'KB',
                    tanggal: new Date().toLocaleDateString('id-ID'), content: e.target.result
                });
                saveDB(dbKey);
                renderWorkspaceFileList(dbKey);
            };
            reader.readAsDataURL(f);
        } else {
            APP_STATE.db[dbKey].push({
                tipe: f.name.endsWith('.csv')?'Data CSV':'File Upload', nama: f.name,
                ukuran: (f.size/1024).toFixed(1)+'KB', tanggal: new Date().toLocaleDateString('id-ID')
            });
        }
    });
    
    setTimeout(()=>{
        saveDB(dbKey);
        addLog(`Upload file ke arsip`);
        renderWorkspaceFileList(dbKey);
        Swal.fire('Berhasil', 'File ditambahkan ke Spreadsheet', 'success');
    }, 500);
}

    list.innerHTML = data.length === 0 ? '<li class="text-slate-400 text-sm text-center py-10 border-2 border-dashed border-slate-200 rounded-xl bg-white"><i class="fas fa-folder-open text-3xl mb-2 block"></i>Belum ada arsip</li>' : '';

function autoFillPenduduk(val) {
    if(!val) return;
    const term = val.toLowerCase().trim();
    const data = (APP_STATE.db.penduduk || []).find(p => (p.nik && p.nik.toLowerCase() === term) || (p.nama && p.nama.toLowerCase().includes(term)) );
    
    if(data) {

            't_nik': data.nik, 't_nama': data.nama, 't_alamat': data.alamat
        };
        for(let key in fieldMap) {
            const el = document.getElementById(key);
            if(el && fieldMap[key]) el.value = fieldMap[key];
        }
        Swal.fire({toast:true, position:'top-end', icon:'success', title:`Data ditemukan: ${data.nama}`, showConfirmButton:false, timer:1500});

function updatePejabatTTD() {
    const p = document.getElementById('pilihan_pejabat_ttd')?.value;
    const inpJabatan = document.getElementById('s_ttd_jabatan');
    const inpNama = document.getElementById('s_ttd_nama');
    if (inpJabatan && inpNama) {
        if (p === 'sekdes') {
            inpJabatan.value = 'An. KEPALA DESA KEBOLEDAN\nSEKRETARIS DESA';
            inpNama.value = 'MASHARUDIN';
        } else {

        }
    }
}

function switchModulPertanahan() {
    const modul = document.getElementById('pilih_modul_pertanahan').value;
    const c = document.getElementById('form-pertanahan-container');
    c.innerHTML = '';
    
    if (modul === 'skw_v2') renderFormSKWV2(c);
    else if (modul === 'kutipan_c_v2') renderFormKutipanCV2(c);
    else if (modul === 'pengajuan_akta') renderFormPengajuanAkta(c);
    else if (modul === 'sporadik') renderFormSporadik(c);
    else if (modul === 'kutipan_c') renderFormKutipanC(c);
    else if (modul === 'skw') renderFormSKW(c);
    else renderFormSuratTanahUmum(c);
}

        </div>

        <p class="indent-10 mb-12">Demikian surat keterangan ini dibuat untuk dipergunakan sebagaimana mestinya.</p>
        <div class="flex justify-end text-center">
            <div>
                <p>Keboledan, ${tgl}</p>
                <p class="font-bold uppercase mb-20">KEPALA DESA KEBOLEDAN</p>
                <p class="font-bold underline uppercase tracking-widest">SAIRUN</p>
            </div>
        </div>
    </div>`;
}

function prosesPreviewPertanahan() {
    const modul = document.getElementById('pilih_modul_pertanahan').value;
    const payload = {};
    document.querySelectorAll('#form-pertanahan-container input, #form-pertanahan-container textarea, #form-pertanahan-container select').forEach(el => {
        if (el.id) payload[el.id] = el.value || '';
    });

    let html = '';
    let docTitle = '';
    let pemohonNama = '';
    let persilInfo = '-';
    let luasInfo = '-';
    let kelasInfo = '-';
    let extraState = null;

    if (modul === 'skw_v2') {
        html = generateHTMLSKWV2();
        docTitle = 'Surat Keterangan Waris (SKW - Versi 2)';
        pemohonNama = payload.skwv2_pewaris_nama || SKW_V2_STATE.pewaris_nama;
        extraState = JSON.parse(JSON.stringify(SKW_V2_STATE));
    } else if (modul === 'kutipan_c_v2') {
        html = generateHTMLKutipanCV2();
        docTitle = 'Kutipan Daftar Buku C (Versi 2)';
        pemohonNama = payload.bcv2_pemilik || BUKU_C_V2_STATE.pemilik;
        persilInfo = payload.bcv2_no_kutipan || BUKU_C_V2_STATE.no_kutipan;
        extraState = JSON.parse(JSON.stringify(BUKU_C_V2_STATE));
    } else if (modul === 'pengajuan_akta') {
        html = generateHTMLPengajuanAkta();
        docTitle = `Pengajuan ${payload.pa_jenis_akta || 'Akta Tanah'} & Daftar Hadir`;
        pemohonNama = `${payload.pa_p1_nama || ''} -> ${payload.pa_p2_nama || ''}`;
        persilInfo = `${payload.pa_persil || '-'} / C.${payload.pa_no_c || '-'}`;
        luasInfo = payload.pa_luas || '-';
        kelasInfo = payload.pa_kelas || '-';
        extraState = JSON.parse(JSON.stringify(PENGAJUAN_AKTA_STATE));
    } else if (modul === 'sporadik') {
        html = generateHTMLSporadik();
        docTitle = 'Paket Lengkap Sporadik (4 Halaman)';
        pemohonNama = payload.sp_pemohon_nama || SPORADIK_STATE.pemohon_nama;
        persilInfo = `${payload.sp_persil || '-'} / C.${payload.sp_letter_c || '-'}`;
        luasInfo = payload.sp_luas || '-';
        kelasInfo = payload.sp_kelas || '-';
        extraState = JSON.parse(JSON.stringify(SPORADIK_STATE));
    } else if (modul === 'kutipan_c') {
        html = generateHTMLKutipanC();
        docTitle = 'Kutipan Daftar Buku C (Standar)';
        pemohonNama = payload.bc_pemilik || BUKU_C_STATE.pemilik;
        persilInfo = payload.bc_no_kutipan || BUKU_C_STATE.no_kutipan;
        extraState = JSON.parse(JSON.stringify(BUKU_C_STATE));
    } else if (modul === 'skw') {
        html = generateHTMLSKW();
        docTitle = 'Surat Keterangan Waris (SKW - Versi 1)';
        pemohonNama = payload.skw_pewaris_nama || SKW_STATE.pewaris_nama;
        extraState = JSON.parse(JSON.stringify(SKW_STATE));
    } else {
        html = generateHTMLSuratTanahUmum();
        docTitle = 'Surat Keterangan Tanah';
        pemohonNama = payload.stu_nama || '-';
        persilInfo = payload.stu_persil || '-';
        luasInfo = payload.stu_luas || '-';
        kelasInfo = payload.stu_kelas || '-';
    }

    openPrintPreview(html);

    if (!APP_STATE.db.arsip_tanah) APP_STATE.db.arsip_tanah = [];
    const arsipTanahEntry = {
        nomor_persil: persilInfo,
        kelas_desa: kelasInfo,
        luas_m2: luasInfo,
        nama_pemilik: pemohonNama,
        alamat_pemilik: 'Desa Keboledan Kec. Wanasari Kab. Brebes',
        sebab_perubahan: docTitle,
        tanggal_perubahan: getAutoTanggalSistem(),
        jenis_dokumen: docTitle,
        keterangan: `Dicetak via Admin Pertanahan (${modul})`,
        source_module: 'admin_pertanahan',
        sub_type: modul,
        payload: payload,
        extra_state: extraState,
        html_snapshot: html
    };

    if (EDIT_ARCHIVE_CONTEXT && EDIT_ARCHIVE_CONTEXT.dbKey === 'arsip_tanah') {
        APP_STATE.db.arsip_tanah[EDIT_ARCHIVE_CONTEXT.index] = arsipTanahEntry;
        addLog(`Update Arsip Tanah: ${docTitle}`);
        EDIT_ARCHIVE_CONTEXT = null;
    } else {
        APP_STATE.db.arsip_tanah.push(arsipTanahEntry);
        addLog(`Cetak Dokumen Pertanahan: ${docTitle}`);
    }
    saveDB('arsip_tanah');
}
</script>
</body>
</html>
